<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; width:100%; height:100%; background:#0a0c14; color:#e8eef7;
    font-family:"Segoe UI",system-ui,sans-serif; overflow:hidden; overscroll-behavior:none; touch-action:none; }
  /* width/height/transform 는 resizeCanvas()가 visualViewport 기준으로 설정.
     padding(safe-area-inset) 으로 상태바/노치/제스처바 영역을 비워 상단 버튼이 가리지 않게 한다. */
  #wrap{ position:fixed; top:0; left:0; width:100%; height:100%; transform-origin:0 0;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display:flex; align-items:center; justify-content:center; background:#0a0c14; overflow:hidden; }
  #screen{ image-rendering:pixelated; background:#000; touch-action:none; display:block; }
</style>

<body>
<div id="wrap">
  <canvas id="screen" width="480" height="270"></canvas>
</div>
<script>
/* 콘텐츠 레지스트리 — 부별 데이터 파일(data/partN.js)이 definePart()로 내용을 등록하고, 아래 엔진이 이를 사용한다. */
var CONTENT={clash:[],parts:[],areas:{},events:{},enemies:{},enemyPx:{},bossScenes:{},equip:{},items:{},skills:{},learn:{},starts:{}};
/* learn(직업별 습득표)은 부마다 이어 붙인다 — 뒤의 부가 앞의 부 습득표를 덮어쓰지 않도록 */
function definePart(n,c){ CONTENT.parts.push(n); for(var k in c){ if(!CONTENT[k]) CONTENT[k]={};
  if(k==='learn'){ for(var cl in c[k]) CONTENT[k][cl]=(CONTENT[k][cl]||[]).concat(c[k][cl]); }
  else { for(var id in c[k]) if(id in CONTENT[k]) CONTENT.clash.push(k+'.'+id+' (제'+n+'부가 덮어씀)'); Object.assign(CONTENT[k],c[k]); } } // 부끼리 이름이 겹치면 뒤의 부가 앞의 것을 덮어쓴다 — 겹침은 CONTENT.clash 에 남긴다
  if(CONTENT.clash.length&&window.console) console.warn('콘텐츠 이름 겹침: '+CONTENT.clash.join(', ')); }
</script>

<script>
"use strict";
/* ===== 모두의 픽셀모험 — 오리지널 턴제 RPG v2 (단일 파일, 캔버스 터치 조작) =====
   설계 패턴만 참고(상태머신·파티/클래스·아이템·상점·세이브). 전부 오리지널. */
const cv=document.getElementById('screen'), g=cv.getContext('2d');
const W=480,H=270,TILE=30;
/* 저장: 시즌별 슬롯 + 형식 버전. 예전 키(LEGACY_KEY)의 기록은 읽을 때 새 형식으로 변환하고 원본은 지우지 않는다. */
const SEASON=1, SAVE_VER=4, SAVE_KEY='pixel-adventure-s'+SEASON, LEGACY_KEY='three-seals-save-v2';
var DEBUG_ENCOUNTER=false; /* 개발용: 적 조우(풀) 타일을 빨간 점으로 표시. 출시 전 false. */
const wrapEl=document.getElementById('wrap');
function resizeCanvas(){
  const vv=window.visualViewport;
  const vw=vv?vv.width:window.innerWidth, vh=vv?vv.height:window.innerHeight;
  const ox=vv?vv.offsetLeft:0, oy=vv?vv.offsetTop:0;
  // 래퍼를 "현재 보이는 영역"에 정확히 맞춰 고정(border-box) → 하단 버튼이 툴바/제스처바에 가리지 않음
  wrapEl.style.width=vw+'px'; wrapEl.style.height=vh+'px';
  wrapEl.style.transform='translate('+ox+'px,'+oy+'px)';
  // safe-area(상태바·노치·제스처바)를 제외한 실제 가용 영역으로 스케일 계산 → 상단 HUD 버튼이 상태바에 가리지 않음
  const cs=getComputedStyle(wrapEl);
  const pt=parseFloat(cs.paddingTop)||0, pb=parseFloat(cs.paddingBottom)||0;
  const pl=parseFloat(cs.paddingLeft)||0, pr=parseFloat(cs.paddingRight)||0;
  const availW=Math.max(1,vw-pl-pr), availH=Math.max(1,vh-pt-pb);
  const s=Math.min(availW/W, availH/H);
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
}
addEventListener('resize',resizeCanvas);
addEventListener('orientationchange',function(){ setTimeout(resizeCanvas,120); });
if(window.visualViewport){ visualViewport.addEventListener('resize',resizeCanvas); visualViewport.addEventListener('scroll',resizeCanvas); }
addEventListener('scroll',function(){ window.scrollTo(0,0); }); /* 혹시 모를 페이지 스크롤 잠금 */
resizeCanvas();

/* ---------- 입력: 키보드 + 캔버스 탭(핫스폿) ---------- */
const keys={}, pressed={};
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right',
  KeyZ:'confirm',Enter:'confirm',Space:'confirm',KeyX:'cancel',Escape:'cancel'};
function setKey(k,d){ if(!k) return; if(d&&!keys[k]) pressed[k]=true; keys[k]=d; }
addEventListener('keydown',e=>{const k=KEYMAP[e.code]; if(k){e.preventDefault(); setKey(k,true);}});
addEventListener('keyup',  e=>{const k=KEYMAP[e.code]; if(k){e.preventDefault(); setKey(k,false);}});
function consume(k){ if(pressed[k]){ pressed[k]=false; return true; } return false; }
function clearPressed(){ for(const k in pressed) pressed[k]=false; }

let hotspots=[];
function hz(x,y,w,h,fn){ hotspots.push({x,y,w,h,fn}); }
function canvasPt(cx,cy){ const r=cv.getBoundingClientRect(); return { x:(cx-r.left)*(W/r.width), y:(cy-r.top)*(H/r.height) }; }
let mouseDown=false, joy={active:false,ox:0,oy:0,x:0,y:0,moved:false,tx:0,ty:0}, joyDir=null;
function onDown(p){
  resumeAudio();
  if(!bgm.started){ bgm.started=true; playBGM(state==='battle'?'battle':state==='title'?'title':'field'); }
  for(let i=hotspots.length-1;i>=0;i--){ const h=hotspots[i];
    if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){ h.fn(); return; } }
  if(state==='field'&&!msg){ joy.active=true; joy.ox=joy.x=p.x; joy.oy=joy.y=p.y; joy.moved=false; joyDir=null;
    joy.tx=Math.floor((p.x+camOX)/TILE); joy.ty=Math.floor((p.y+camOY)/TILE); }
}
function onMove(p){ if(!joy.active) return; joy.x=p.x; joy.y=p.y;
  const dx=p.x-joy.ox, dy=p.y-joy.oy; if(Math.hypot(dx,dy)>9){ joy.moved=true;
    joyDir=Math.abs(dx)>=Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'); } else joyDir=null; }
function onUp(){ if(joy.active){ if(!joy.moved&&state==='field'&&!msg) tryInteractAt(joy.tx,joy.ty); joy.active=false; joyDir=null; } }
cv.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.changedTouches[0]; onDown(canvasPt(t.clientX,t.clientY)); },{passive:false});
cv.addEventListener('touchmove',e=>{ e.preventDefault(); const t=e.changedTouches[0]; onMove(canvasPt(t.clientX,t.clientY)); },{passive:false});
cv.addEventListener('touchend',e=>{ e.preventDefault(); onUp(); },{passive:false});
cv.addEventListener('touchcancel',e=>{ e.preventDefault(); onUp(); },{passive:false});
cv.addEventListener('mousedown',e=>{ mouseDown=true; onDown(canvasPt(e.clientX,e.clientY)); });
cv.addEventListener('mousemove',e=>{ if(mouseDown) onMove(canvasPt(e.clientX,e.clientY)); });
addEventListener('mouseup',e=>{ if(mouseDown){ mouseDown=false; onUp(); } });

/* ---------- 효과음 (WebAudio, 전부 합성음) ---------- */
let actx=null;
function resumeAudio(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function sfx(type){ try{ if(!actx) return; const o=actx.createOscillator(), ga=actx.createGain();
  o.connect(ga); ga.connect(actx.destination); const t=actx.currentTime;
  let f=440,d=0.08,w='square',f2=0;
  if(type==='hit'){f=170;d=0.09;w='square';} else if(type==='heal'){f=680;d=0.14;w='sine';}
  else if(type==='sel'){f=520;d=0.04;w='triangle';} else if(type==='win'){f=820;d=0.3;w='sine';}
  else if(type==='slash'){f=620;f2=180;d=0.09;w='sawtooth';} else if(type==='heavy'){f=220;f2=55;d=0.2;w='square';}
  else if(type==='arrow'){f=1300;f2=500;d=0.08;w='triangle';} else if(type==='orb'){f=420;f2=900;d=0.14;w='sine';}
  else if(type==='fire'){f=260;f2=70;d=0.26;w='sawtooth';} else if(type==='ice'){f=1500;f2=2400;d=0.14;w='triangle';}
  else if(type==='bolt'){f=900;f2=60;d=0.24;w='square';}
  else if(type==='claw'){f=780;f2=240;d=0.07;w='sawtooth';} else if(type==='bite'){f=260;f2=110;d=0.06;w='square';}
  else if(type==='dark'){f=320;f2=90;d=0.22;w='sine';} else if(type==='splat'){f=200;f2=420;d=0.1;w='triangle';}
  else if(type==='wind'){f=1100;f2=1900;d=0.16;w='sine';}
  else if(type==='down'){f=120;d=0.18;w='sawtooth';} else if(type==='coin'){f=980;d=0.08;w='square';}
  o.type=w; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d); ga.gain.setValueAtTime(0.06,t); ga.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.start(t); o.stop(t+d);
}catch(e){} }
/* ---------- BGM (합성 멜로디, 전부 오리지널) ---------- */
let bgm={timer:null,kind:null,step:0,muted:false,started:false};
const dbl=a=>a.reduce((o,n)=>(o.push(n,n),o),[]); // 베이스는 두 박마다 한 번 울리므로 같은 음을 두 칸씩 적는다
const SONGS={
  field:{tempo:300, mel:[64,67,69,67, 71,69,67,64, 62,64,67,64, 67,69,71,0], bass:[52,52,45,45, 47,47,43,43]},
  battle:{tempo:205, mel:[57,60,62,60, 64,62,60,57, 55,58,60,58, 60,62,64,0], bass:[45,45,43,43, 41,41,40,40]},
  /* 마을: 느긋한 장조 */
  town:{tempo:340, mel:[72,0,76,79, 77,76,74,0, 72,74,76,72, 74,0,67,0, 69,0,72,76, 74,72,71,0, 72,76,79,76, 72,0,0,0], bass:dbl([48,48,53,53,45,45,43,43, 53,53,43,43,48,52,48,48])},
  /* 던전: 음이 드문드문한 단조 */
  dungeon:{tempo:380, mel:[57,0,60,0, 64,0,63,0, 62,0,59,0, 60,0,0,0, 57,0,60,0, 65,0,64,0, 62,60,59,0, 57,0,0,0], bass:dbl([45,45,45,45,41,41,43,43, 45,45,41,41,43,43,45,45])},
  /* 균열: 반음이 섞인 불안한 선율 */
  rift:{tempo:330, mel:[64,0,63,0, 64,0,59,0, 60,0,59,0, 57,0,0,56, 64,0,63,0, 64,0,67,0, 66,0,63,0, 64,0,0,0], bass:dbl([52,52,52,52,57,57,56,56, 52,52,55,55,54,54,52,52])},
  /* 보스: 빠르게 몰아치는 단조, 각진 음색 */
  boss:{tempo:165, wave:'square', gain:0.016, mel:[62,62,65,62, 69,67,65,62, 61,61,64,61, 69,67,64,61, 62,65,69,74, 72,69,70,69, 67,65,64,62, 61,64,69,0], bass:dbl([50,50,50,50,49,49,49,49, 50,50,46,46,48,48,45,45])},
  /* 타이틀: 밝게 올라가는 선율 */
  title:{tempo:320, mel:[67,0,72,74, 76,0,74,72, 74,0,71,67, 69,0,0,0, 67,0,72,74, 76,0,79,76, 77,76,74,71, 72,0,0,0], bass:dbl([48,48,52,52,55,55,53,53, 48,48,52,52,53,53,48,48])},
};
function nf(n){ return n>0?440*Math.pow(2,(n-69)/12):0; }
function tone(f,type,gain,dur){ try{ if(!actx||f<=0) return; const o=actx.createOscillator(),g2=actx.createGain(); o.type=type; o.frequency.value=f; o.connect(g2); g2.connect(actx.destination); const t=actx.currentTime; g2.gain.setValueAtTime(gain,t); g2.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur); }catch(e){} }
function stopBGM(){ if(bgm.timer){ clearInterval(bgm.timer); bgm.timer=null; } }
function playBGM(kind){ bgm.kind=kind; stopBGM(); if(bgm.muted||!actx) return; const s=SONGS[kind]; if(!s) return; bgm.step=0;
  bgm.timer=setInterval(()=>{ if(bgm.muted||bgm.kind!==kind) return; const st=bgm.step, m=s.mel[st%s.mel.length], b=s.bass[st%s.bass.length];
    tone(nf(m),s.wave||'triangle',s.gain||0.03,s.tempo/1000*0.85); if(st%2===0) tone(nf(b),'sine',0.028,s.tempo/1000*1.6); bgm.step++; }, s.tempo); }
function toggleMute(){ bgm.muted=!bgm.muted; if(bgm.muted) stopBGM(); else playBGM(bgm.kind||'field'); }

/* ---------- 데이터: 스킬 ---------- */
const SKILLS={
  powerStrike:{name:'강타',fx:'heavy',mp:4,kind:'phys',power:1.8,stun:0.3,target:'enemy',msg:'의 강타!'},
  cleave:     {name:'참격',fx:'wide',mp:7,kind:'phys',power:1.0,target:'allEnemies',msg:'의 참격!'},
  flameBolt:  {name:'화염탄',fx:'fire',el:'fire',mp:5,kind:'magic',power:2.2,target:'enemy',msg:'의 화염탄!'},
  frostLance: {name:'서리창',fx:'ice',el:'ice',mp:7,kind:'magic',power:2.8,target:'enemy',msg:'의 서리창!'},
  thunder:    {name:'낙뢰',fx:'bolt',el:'bolt',mp:10,kind:'magic',power:1.6,target:'allEnemies',msg:'의 낙뢰!'},
  heal:       {name:'치유',fx:'heal',mp:5,kind:'heal',power:3.0,target:'ally',msg:'의 치유!'},
  cureAll:    {name:'치유의 바람',fx:'heal',mp:10,kind:'healAll',power:2.2,target:'allAllies',msg:'의 치유의 바람!'},
  revive:     {name:'소생',fx:'revive',mp:12,kind:'revive',power:0.5,target:'allyDead',msg:'의 소생!'},
  doubleCut:  {name:'연격',fx:'double',el:'arrow',mp:4,kind:'phys',power:1.1,hits:2,target:'enemy',msg:'의 연격!'},
  venom:      {name:'독침',fx:'venom',el:'arrow',mp:3,kind:'phys',power:1.1,target:'enemy',poison:3,msg:'의 독침!'},
  /* 수치가 아니라 쓰임새가 다른 기술들. buff/debuff 의 turns 는 건 차례를 포함해 세므로 4 = 이후 3턴 */
  taunt:      {name:'도발',mp:4,kind:'buff',buff:'taunt',turns:4,target:'self',msg:'의 도발!',note:'적의 공격을 끌어당긴다',desc:'공격 끌기·피해↓ 3턴'},
  warcry:     {name:'함성',mp:8,kind:'buff',buff:'atkUp',turns:4,target:'allAllies',msg:'의 함성!',note:'전원의 공격이 강해진다',desc:'아군 전체 공격↑ 3턴'},
  manaDrain:  {name:'마력흡수',fx:'staff',mp:0,kind:'magic',power:1.2,mpGain:0.08,target:'enemy',msg:'의 마력 흡수!',desc:'단일 ×1.2 +MP 회복'},
  sapMist:    {name:'쇠약의 안개',mp:9,kind:'debuff',debuff:'sapT',turns:4,target:'allEnemies',msg:'의 쇠약의 안개!',note:'적 전체의 공격이 약해진다',desc:'적 전체 공격↓ 3턴'},
  cleanse:    {name:'정화',fx:'heal',mp:3,kind:'heal',power:1.5,cleanse:1,target:'ally',msg:'의 정화!',desc:'회복 +상태이상 해제'},
  holyArrow:  {name:'빛의 화살',fx:'staff',mp:6,kind:'magic',power:1.5,mend:0.5,target:'enemy',msg:'의 빛의 화살!',desc:'단일 ×1.5 +아군 회복'},
  mark:       {name:'표식',fx:'bow',el:'arrow',mp:4,kind:'phys',power:1.0,mark:4,target:'enemy',msg:'의 표식 사격!',desc:'단일 ×1 +치명타 표식'},
  quickShot:  {name:'속사',fx:'bow',el:'arrow',mp:4,kind:'phys',power:1.4,pri:1,target:'enemy',msg:'의 속사!',desc:'단일 ×1.4 가장 먼저'},
};
/* ---------- 데이터: 특성(레벨로 얻는 상시 효과) ---------- */
const TRAITS={
  counter: {name:'반격',desc:'물리 공격을 받으면 30% 확률로 되받아친다'},
  endure:  {name:'불굴',desc:'전투마다 한 번, 쓰러질 피해를 HP 1로 버틴다'},
  fury:    {name:'투지',desc:'HP가 절반 이하일 때 주는 피해 1.25배'},
  insight: {name:'약점 간파',desc:'약점을 찌르면 피해 1.4배 대신 1.6배'},
  chain:   {name:'마력 순환',desc:'마법으로 적을 쓰러뜨리면 MP 6 회복'},
  prayer:  {name:'기도',desc:'매 턴이 끝날 때 MP가 조금 회복된다'},
  firstAid:{name:'응급 처치',desc:'HP 30% 이하인 아군에게는 회복량 1.5배'},
  ambush:  {name:'기습',desc:'전투 첫 턴에 가장 먼저 움직이고 반드시 치명타'},
  exploit: {name:'급소 찌르기',desc:'독·약화·표식·기절 상태의 적에게 피해 1.2배'},
};
Object.assign(TRAITS,CONTENT.traits||{}); // 부별 데이터가 추가한 특성(직업 특성 등)
function has(p,t){ return !!(p&&p.traits&&p.traits.includes(t)); }
/* ---------- 전직 ----------
   p.cls 는 처음 직업(무기·그림·장비 제한의 기준)으로 그대로 두고, 전직한 직업은 p.job 에 둔다.
   CONTENT.jobs[id]={base(처음 직업), name, role, col, bonus(전직 즉시 오르는 능력치), grow(레벨당 성장)}. 직업 기술·특성은 CONTENT.learn[id] */
const JOBS=CONTENT.jobs||{};
function jobOf(p){ return (p&&p.job&&JOBS[p.job])||null; }
/* 2차 전직: CONTENT.jobs2[id]={from(1차 직업 id), name, role, col, bonus, grow}. 1차 직업마다 하나씩 이어진다. p.job2 에 두고, 다른 갈래의 기술 하나(p.inherit)를 이어받는다 */
const JOBS2=CONTENT.jobs2||{};
function job2Of(p){ return (p&&p.job2&&JOBS2[p.job2])||null; }
function job2For(p){ return (p&&p.job&&Object.keys(JOBS2).find(id=>JOBS2[id].from===p.job))||null; }
function inheritChoices(p){ const j=jobOf(p); if(!j) return []; const o=Object.keys(JOBS).find(id=>id!==p.job&&JOBS[id].base===j.base); return o?(CONTENT.learn[o]||[]).filter(e=>e.id&&SKILLS[e.id]).map(e=>e.id):[]; }

function changeJob(p,id){ const j=JOBS[id]; if(!j||j.base!==p.cls||p.job===id||p.job2) return null; // 2차 전직 뒤에는 1차를 바꿀 수 없다
  if(p.job) clearJob(p);
  p.job=id; p.jobLv=p.lv; for(const k in STAT_KEY) p[STAT_KEY[k]]+=(j.bonus&&j.bonus[k])||0; if(p.alive){ p.hp=p.maxhp; p.mp=p.maxmp; } return learnSkills(p); }
/* 전직 되돌리기: 즉시 보너스와, 전직 뒤 레벨마다 더 받은 성장분을 빼고 직업 기술·특성을 지운다 */
function clearJob(p){ if(p.job2) return; const j=jobOf(p); if(!j){ p.job=null; return; } const base=GROW[p.cls]||GROW['검사'], L=Math.max(0,p.lv-(p.jobLv||p.lv)), ls=CONTENT.learn[p.job]||[];
  for(const k in STAT_KEY) p[STAT_KEY[k]]-=((j.bonus&&j.bonus[k])||0)+(((j.grow||base)[k])-base[k])*L;
  p.skills=p.skills.filter(id=>!ls.some(e=>e.id===id)); p.traits=(p.traits||[]).filter(t=>!ls.some(e=>e.trait===t)); p.off=(p.off||[]).filter(id=>p.skills.includes(id));
  p.job=null; p.jobLv=null; p.hp=Math.max(p.alive?1:0,Math.min(p.hp,p.maxhp)); p.mp=Math.min(p.mp,p.maxmp); fitLoadout(p); }

const RESPEC_COST=1000;
function inheritFor(jobId){ const j=JOBS[jobId]; if(!j) return []; const o=Object.keys(JOBS).find(id=>id!==jobId&&JOBS[id].base===j.base); return o?(CONTENT.learn[o]||[]).filter(e=>e.id&&SKILLS[e.id]).map(e=>e.id):[]; }
function respecJob(p,newJob,inh){ const base=GROW[p.cls]||GROW['검사'], oj=JOBS[p.job], nj=JOBS[newJob]; if(!oj||!nj||nj.base!==p.cls||p.guest) return null;
  const o2=job2Of(p), L1=Math.max(0,p.lv-(p.jobLv||p.lv)), L2=o2?Math.max(0,p.lv-(p.job2Lv||p.lv)):0, rm=[], B=(j,k)=>(j.bonus&&j.bonus[k])||0, G=(j,k)=>(j.grow||base)[k];
  /* 걷어내기: 전직 보너스와, 전직 뒤 레벨마다 기본 직업보다 더 받은 성장분 */
  for(const k in STAT_KEY) p[STAT_KEY[k]]-=B(oj,k)+(G(oj,k)-base[k])*(L1-L2)+(o2?B(o2,k)+(G(o2,k)-base[k])*L2:0);
  (CONTENT.learn[p.job]||[]).concat(o2?(CONTENT.learn[p.job2]||[]):[]).forEach(e=>rm.push(e.id||e.trait)); if(p.inherit) rm.push(p.inherit);
  p.skills=p.skills.filter(id=>!rm.includes(id)); p.traits=(p.traits||[]).filter(t=>!rm.includes(t)); p.inherit=null;
  /* 다시 입히기 */
  p.job=newJob; const n2id=o2?job2For(p):null, n2=n2id?JOBS2[n2id]:null; p.job2=n2?n2id:null; if(!n2) p.job2Lv=null;
  for(const k in STAT_KEY) p[STAT_KEY[k]]+=B(nj,k)+(G(nj,k)-base[k])*(L1-L2)+(n2?B(n2,k)+(G(n2,k)-base[k])*L2:0);
  const got=learnSkills(p); if(n2&&inh&&SKILLS[inh]&&inheritFor(newJob).includes(inh)&&!p.skills.includes(inh)){ p.inherit=inh; p.skills.push(inh); got.push(SKILLS[inh].name+'(이어받음)'); }
  p.off=(p.off||[]).filter(id=>p.skills.includes(id)); fitLoadout(p); if(p.alive){ p.hp=p.maxhp; p.mp=p.maxmp; } return got; }
/* ---------- 기술 장착 ---------- 배운 기술 중 전투에 들고 가는 것은 MAX_SK 개까지. p.off = 빼 둔 기술 */

/* m = 지역별 강도 배율(enc.pow 공격·마력, enc.hpw 체력). 같은 적이 여러 지역에 나와도 깊은 곳일수록 강하게 만든다 */
function spawn(id,m){ const b=ENEMY_DB[id], e={...b,id,hp:b.hp,maxhp:b.hp,alive:true,flash:0,poison:0};
  if(m&&m.pow){ e.atk=Math.round(e.atk*m.pow); e.mag=Math.round(e.mag*m.pow); } if(m&&m.hpw){ e.hp=e.maxhp=Math.round(e.hp*m.hpw); } return e; }

/* ---------- 지역(Area) 엔진 ----------
   토큰: 0 바닥 · 1 벽/집/나무 · 2 풀(조우) · 3 제단(저장·회복) · 4 봉인(보스) · 5 보물 */
const AREAS=CONTENT.areas; /* 부별 데이터 파일에서 정의 */
/* 숨은 강적: CONTENT.elites[지역]={x,y,id,lv}. 밟으면 싸울지 묻는다. 안 싸워도 이야기는 진행된다. 쓰러뜨리면 storyFlags['elite_'+지역] */
for(const a in (CONTENT.elites||{})) if(AREAS[a]) AREAS[a].elite=CONTENT.elites[a];
/* ---------- 마을 부탁 ----------
   CONTENT.quests[id]={area,x,y,name,color,shade, title, kill:{적 id:마릿수} 또는 flag:'플래그'(예: 숨은 강적 elite_지역), goal(무엇을 하면 되는지 한 줄),
     ask:[…], doing:'…', thanks:[…], after:'…', reward:{gold, items:{id:n}}}. 대사는 모두 부탁한 사람의 말이다.
   진행: qa_id(맡음) · qb_id(맡은 순간의 처치 수) · qd_id(끝냄). 마릿수는 맡은 뒤에 쓰러뜨린 것만 센다 */
const QUESTS=CONTENT.quests||{};
for(const id in QUESTS){ const q=QUESTS[id], A=AREAS[q.area]; if(A){ A.npcs=A.npcs||[]; A.npcs.push({x:q.x,y:q.y,color:q.color||'#d9cdb5',name:q.name,look:q.look,shade:q.shade,shadeLook:q.shadeLook,quest:id}); } }
function questProg(id){ const q=QUESTS[id], b=storyFlags['qb_'+id]||{}; return Object.keys(q.kill||{}).map(e=>[e,Math.max(0,Math.min(q.kill[e],(storyFlags['k_'+e]||0)-(b[e]||0))),q.kill[e]]); }
function questMet(id){ const q=QUESTS[id]; return q.flag?!!storyFlags[q.flag]:questProg(id).every(p=>p[1]>=p[2]); }
function questState(id){ return storyFlags['qd_'+id]?'done':!storyFlags['qa_'+id]?'new':questMet(id)?'ready':'doing'; }
function questGoal(id){ const q=QUESTS[id]; return q.kill?questProg(id).map(p=>ENEMY_DB[p[0]].name+' '+p[1]+'/'+p[2]).join(' · '):q.goal; }
function questTalk(id){ const q=QUESTS[id], st=questState(id), S=t=>({n:q.name,t,c:q.color||'#d9cdb5'});
  if(st==='done'){ showMsg([S(q.after)]); return; }
  if(st==='doing'){ showMsg([S(q.doing),'부탁 「'+q.title+'」 — '+questGoal(id)]); return; }
  const finish=()=>{ const r=q.reward||{}, got=[]; if(r.gold){ gold+=r.gold; got.push('◆'+r.gold); } for(const it in (r.items||{})){ inventory[it]=(inventory[it]||0)+r.items[it]; got.push(itemDef(it).name+' ×'+r.items[it]); }
    storyFlags['qd_'+id]=1; sfx('coin'); showMsg(q.thanks.map(S).concat(['부탁 「'+q.title+'」 완료!  '+got.join(' · ')]),()=>{ saveGame(); }); };
  if(st==='ready'){ finish(); return; }
  askMsg(q.ask.map(S).concat(['부탁 「'+q.title+'」 — '+(q.kill?Object.keys(q.kill).map(e=>ENEMY_DB[e].name+' '+q.kill[e]+'마리').join(' · '):q.goal)]),'맡는다','다음에',()=>{
    storyFlags['qa_'+id]=1; const b={}; for(const e in (q.kill||{})) b[e]=storyFlags['k_'+e]||0; storyFlags['qb_'+id]=b;
    if(questMet(id)) finish(); else showMsg(['부탁을 맡았다. 끝내면 다시 찾아오자.'],()=>{ saveGame(); }); }); }
function questCount(){ const ids=Object.keys(QUESTS); return ids.filter(id=>storyFlags['qd_'+id]).length+'/'+ids.length; }
/* 강적은 일행이 권장 레벨보다 높으면 그만큼 강해진다(늦게 찾아가도 싱겁지 않게) */
function eliteScale(el){ const L=party.reduce((m,p)=>Math.max(m,p.lv),1), r=Math.max(1,L/el.lv); return {pow:Math.pow(r,ELITE_POW),hpw:Math.pow(r,ELITE_HPW)}; }
let ELITE_POW=1.0, ELITE_HPW=1.9;
function eliteAsk(el){ const b=ENEMY_DB[el.id], area=cur.id; sfx('dark');
  askMsg(['불길한 기운이 서려 있다 — 「'+b.name+'」','이곳의 주인보다 훨씬 강하다. 져도 골드는 잃지 않는다. (권장 Lv'+el.lv+')'],'싸운다','물러난다',()=>{
    startBattle([el.id],true,{scale:eliteScale(el),noPenalty:true,onWin:()=>{ storyFlags['elite_'+area]=1; showMsg(['「'+b.name+'」을(를) 쓰러뜨렸다! 서려 있던 기운이 걷힌다.'],()=>{ saveGame(); }); }}); }); }
let cur=null, MAP=[], MAPW=0, MAPH=0;
function loadArea(id,tx,ty,dir){ cur=AREAS[id]; if(!cur) return; cur.id=id;
  MAP=cur.src.map(r=>r.split('')); MAPW=MAP[0].length; MAPH=MAP.length;
  for(let y=0;y<MAPH;y++)for(let x=0;x<MAPW;x++){ if(MAP[y][x]==='5'&&chests[cur.id+':'+x+','+y]) MAP[y][x]='0'; }
  if(cur.boss&&storyFlags['sealDone_'+cur.id]) for(let y=0;y<MAPH;y++)for(let x=0;x<MAPW;x++) if(MAP[y][x]==='4') MAP[y][x]='0';
  if(storyFlags['gate_'+cur.id]) for(let y=0;y<MAPH;y++)for(let x=0;x<MAPW;x++) if(MAP[y][x]==='9') MAP[y][x]='0';
  player.x=tx; player.y=ty; player.px=tx*TILE; player.py=ty*TILE; player.moving=false; if(dir) player.dir=dir;
  joy.active=false; joyDir=null; fieldMove=null;
  if(cur.bgm&&bgm.started) playBGM(cur.bgm);
  if(cur.onEnter) runEvent(cur.onEnter); }
/* 마을 사람의 그림: 모습을 잃은 사람(shade)은 그림자 그림, look 이 적혀 있으면 그 인물의 그림. 없으면 기본 모양 */
function npcArt(n){ const N=ART.npcPx||{}, H=ART.heroPx||{}; if(typeof n.shade==='function'?n.shade():n.shade) return N[n.shadeLook]||N[n.child?'shadeChild':'shadeFolk']||null; return n.look?(N[n.look]||H[n.look]||HEROPX[n.look]||null):null; }
function npcOn(n){ return !n.when||(typeof n.when==='function'?!!n.when():!!storyFlags[n.when]); } // when: 그 조건일 때만 서 있는 사람
function npcAt(x,y){ return (cur&&cur.npcs)?cur.npcs.find(n=>n.x===x&&n.y===y&&npcOn(n)):null; }
function warpOn(w){ return !w.when||!!storyFlags[w.when]; } // when: 그 플래그가 선 뒤에만 생기는 길
function warpAt(x,y){ return (cur&&cur.warps)?cur.warps.find(w=>w.x===x&&w.y===y&&warpOn(w)):null; }
function runEvent(key){ const f=EVENTS[key]; if(f) f(); }
function checkGate(){ if(!cur||storyFlags['gate_'+cur.id]) return false; let total=0,on=0;
  for(let y=0;y<cur.src.length;y++)for(let x=0;x<cur.src[y].length;x++){ if(cur.src[y][x]==='8'){ total++; if(storyFlags['sw_'+cur.id+'_'+x+','+y]) on++; } }
  if(total>0&&on>=total){ storyFlags['gate_'+cur.id]=true; for(let y=0;y<MAPH;y++)for(let x=0;x<MAPW;x++) if(MAP[y][x]==='9') MAP[y][x]='0'; sfx('win'); return true; }
  return false; }

const EVENTS=CONTENT.events; /* 부별 데이터 파일에서 정의 */
function bossScene(id,kind){ const s=CONTENT.bossScenes[id]; return (s&&s[kind])||["수호물이 깨어난다!"]; }

function fmtTime(t){ t=Math.floor(t); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), ss=t%60; return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(ss).padStart(2,'0'); }

/* ---------- 유틸 ---------- */
const rnd=n=>Math.floor(Math.random()*n), clamp=(v,a,b)=>v<a?a:v>b?b:v;
function showMsg(l,after){ msg={lines:Array.isArray(l)?l:[l], i:0, after:after||null}; }
function tile(x,y){ if(x<0||y<0||x>=MAPW||y>=MAPH) return '1'; return MAP[y][x]; }
function livingParty(){ return party.filter(p=>p.alive); }
function invList(){ return Object.keys(ITEMS).filter(k=>inventory[k]>0); }
function battleItems(){ return invList().filter(k=>!ITEMS[k].boost); } // 열매는 전투 중 사용 불가
/* 장비 id를 p가 지금 그 부위에 찬 것과 비교: t=증감 합계, txt='ATK+7 DEF-2' (같으면 빈 문자열) */
function eqDiff(p,id){ const e=EQUIP[id], c=p[e.slot]&&EQUIP[p[e.slot]]; let t=0; const o=[]; for(const k of ['atk','def','mag','spd']){ const d=(e[k]||0)-((c&&c[k])||0); if(d){ t+=d; o.push(k.toUpperCase()+(d>0?'+':'')+d); } } return {t,txt:o.join(' '),cur:c}; }
function diffColor(t){ return t>0?'#8fdc6e':t<0?'#ff8a6a':'#8a93ad'; }
function ownedEquip(){ return Object.keys(EQUIP).filter(k=>inventory[k]>0); }
function eqSum(p,stat){ let s=0; for(const sl of SLOTS){ const e=p[sl]&&EQUIP[p[sl]]; if(e&&e[stat]) s+=e[stat]; } return s; }
function atkOf(p){ return p.atk + eqSum(p,'atk'); }
function defOf(p){ return p.def + eqSum(p,'def'); }
function magOf(p){ return p.mag + eqSum(p,'mag'); }
function spdEff(p){ return p.spd + eqSum(p,'spd'); }
function canEquip(p,id){ const e=EQUIP[id]; return !!e && !(e.slot==='weapon'&&e.cls&&!e.cls.includes(p.cls)); }
function equip(p,id){ const e=EQUIP[id]; if(!e||(inventory[id]||0)<=0) return;
  if(!canEquip(p,id)){ flashMenu(`${p.cls}는 ${e.name} 장착 불가`); return; }
  const old=p[e.slot]; inventory[id]--; if(old) inventory[old]=(inventory[old]||0)+1; p[e.slot]=id; sfx('sel'); const fd=fxDesc(e); if(fd) flashMenu('★ '+e.name+' — '+fd); }
function unequip(p,slot){ if(p[slot]){ inventory[p[slot]]=(inventory[p[slot]]||0)+1; p[slot]=null; sfx('sel'); } }
function invCount(){ return invList().reduce((s,k)=>s+inventory[k],0); }
function firstDead(){ return party.findIndex(p=>!p.alive); }

/* ---------- 세이브 ---------- */
function currentPart(){ let n=1; while(storyFlags['part'+n+'Clear']) n++; return n; } // 진행 중인 부(1부 클리어 → 2)
/* 다음 목표: CONTENT.goals[부] = [[완료 플래그, 안내문], …] 에서 아직 끝내지 않은 첫 항목 */
function currentGoal(){ const gs=(CONTENT.goals||{})[currentPart()]; if(!gs) return '다음 이야기를 준비하고 있습니다'; for(const e of gs) if(!storyFlags[e[0]]) return e[1]; return ''; }
/* 자동 저장: 이동·전투 직후처럼 안전한 순간에만(대화·전투 중에는 저장하지 않는다) */
function autoSave(){ if(state==='field'&&!msg&&!battle&&cur) saveGame(); }
function saveGame(){ try{ checkFeats(); localStorage.setItem(SAVE_KEY,JSON.stringify(
  {v:SAVE_VER,season:SEASON,part:currentPart(),savedAt:Date.now(),playSec:Math.round(playSec),
   party,area:cur?cur.id:'village',player:{x:player.x,y:player.y,dir:player.dir},gold,inventory,sealsFixed,bossStage,chests,flags:storyFlags,choices})); return true; }catch(e){ return false; } }
/* 저장 형식 변환: 버전별 변환을 순서대로 적용한 뒤 공통 정규화. 새 버전을 만들면 여기에 단계만 추가한다. */
/* 끝낸 부의 진행 플래그를 모두 세운다: CONTENT.clearFlags[부]. 「N부부터 시작」으로 만든 기록은 앞 부의 플래그가 비어 있어,
   그대로 앞 부 지역에 돌아가면 끝난 이야기와 보스가 다시 나온다 */
function markCleared(f){ const cf=CONTENT.clearFlags||{}; for(const n in cf) if(f['part'+n+'Clear']) for(const k of cf[n]) f[k]=true; }
function migrateSave(d){ const v=d.v||2;
  if(v<3){ const f=d.flags=d.flags||{}; // v2(버전 표기 없음) → v3: 심층 맵 추가 전 기록의 관문 통과 처리 + 새 필드
    if(f.sealDone_forest) f.key_forest=true; if(f.sealDone_cave) f.key_cave=true; if(f.merchEntered) f.ridgeDone=true; if(f.altarEntered) f.abyssDone=true;
    d.choices=d.choices||{}; d.playSec=d.playSec||0; d.season=1; }
  if(v<4){ (d.party||[]).forEach(p=>{ const L=(p.lv||1)-1; // v3 → v4: 직업별 성장 차이를 지난 레벨에도 소급
      if(p.cls==='검사'){ p.maxhp+=L; p.hp+=L; p.def+=L; p.mag-=L; } else if(p.cls==='궁수'){ p.spd+=L; p.mag-=L; } else { p.maxmp+=L; p.mp+=L; p.atk-=L; } }); }
  d.flags=d.flags||{}; d.inventory=d.inventory||{potion:1}; markCleared(d.flags); if(!d.flags.ch19done){ delete d.flags.lordDown; delete d.flags.ch20done; } /* 한때 2부 13장이 3부 20장 장면으로 잘못 이어지던 판에서 선 플래그를 걷어낸다 */ for(const id in DROPS){ const dr=DROPS[id]; if(dr.done&&d.flags[dr.done]&&!d.flags['k_'+id]) d.flags['k_'+id]=1; } // 도감: 이미 잡은 보스는 처치 1로 기록
  d.retroLoot=pastLoot(d.flags,d.inventory,dr=>!!(dr.done&&d.flags[dr.done])); // 이미 잡은 보스의 전리품을 한 번 지급
  (d.party||[]).forEach(p=>{ for(const sl of SLOTS) if(p[sl]===undefined) p[sl]=null; learnSkills(p); p.expNext=expNeed(p.lv||1); if(!(p.exp<p.expNext)) p.exp=Math.max(0,p.expNext-1); });
  d.v=SAVE_VER; return d; }
function readSave(){ try{ const raw=localStorage.getItem(SAVE_KEY)||localStorage.getItem(LEGACY_KEY); if(!raw) return null; const d=JSON.parse(raw); return d?migrateSave(d):null; }catch(e){ return null; } }
function loadGame(){ try{ const d=readSave(); if(!d) return false;
  party=d.party; gold=d.gold||0; inventory=d.inventory||{potion:1}; sealsFixed=d.sealsFixed==null?3:d.sealsFixed; bossStage=d.bossStage||0; chests=d.chests||{}; storyFlags=d.flags||{};
  choices=d.choices||{}; playSec=d.playSec||0; retroNote=d.retroLoot||0;
  const area=AREAS[d.area]?d.area:'village', px=(d.player&&d.player.x)||3, py=(d.player&&d.player.y)||3, dir=(d.player&&d.player.dir)||'down';
  player={x:px,y:py,dir,px:px*TILE,py:py*TILE,moving:false,steps:0};
  loadArea(area,px,py,dir); return true; }catch(e){ return false; } }
function hasSave(){ try{ return !!(localStorage.getItem(SAVE_KEY)||localStorage.getItem(LEGACY_KEY)); }catch(e){ return false; } }

  g.strokeStyle=o.bd||'#30406a'; g.lineWidth=1; g.strokeRect(x+.5,y+.5,w-1,h-1);
  g.fillStyle=o.fg||'#cdd6ea'; g.font=o.font||'12px sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(label,x+w/2,y+h/2); g.textAlign='left'; g.textBaseline='alphabetic';

function bar(x,y,w,h,r,c){ g.fillStyle='#232b40'; g.fillRect(x,y,w,h); g.fillStyle=c; g.fillRect(x,y,Math.max(0,w*clamp(r,0,1)),h); }
function chibi(x,y,color){ const s=TILE; g.fillStyle='#0008'; g.beginPath(); g.ellipse(x+s/2,y+s-3,s*0.32,s*0.14,0,0,7); g.fill();
  const bw=s*0.5,bx=x+(s-bw)/2; g.fillStyle=color; g.fillRect(bx,y+s*0.42,bw,s*0.46);
  const hw=s*0.44,hx=x+(s-hw)/2; g.fillStyle='#f2d6b8'; g.fillRect(hx,y+s*0.05,hw,s*0.38);
  g.fillStyle='#223'; const ey=y+s*0.2,es=Math.max(2,s*0.09); g.fillRect(hx+hw*0.18,ey,es,es); g.fillRect(hx+hw*0.62,ey,es,es); }

const DIRV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function tryInteractAt(tx,ty){ const adj=Math.abs(tx-player.x)+Math.abs(ty-player.y);
  if(adj>1) return false;
  const nz=npcAt(tx,ty); if(nz){ if(nz.quest){ questTalk(nz.quest); sfx('sel'); } else if(nz.shop){ openShop(Array.isArray(nz.shop)?nz.shop:null); sfx('sel'); } else { showMsg((typeof nz.lines==='function'?nz.lines():nz.lines)||['…']); sfx('sel'); } return true; } // lines 가 함수면 진행에 따라 달라지는 대사
  return false; }
function tryInteractFacing(){ const[dx,dy]=DIRV[player.dir]; return tryInteractAt(player.x+dx,player.y+dy); }
function fieldTap(p){ const tx=Math.floor((p.x+camOX)/TILE), ty=Math.floor((p.y+camOY)/TILE);
  if(tryInteractAt(tx,ty)) return;
  const dx=tx-player.x, dy=ty-player.y; if(!dx&&!dy) return;
  fieldMove = Math.abs(dx)>=Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up'); }
function updateField(){ if(msg) return;
  if(encAlert>0){ encAlert--; if(encAlert===0&&encPending){ const es=encPending; encPending=null; startBattle(es,false,{scale:cur.enc}); } return; } // 조우 경고 중 이동 정지
  if(!player.moving){ let dir=null;
    for(const d of ['up','down','left','right']) if(keys[d]){ dir=d; break; }
    if(!dir&&joyDir) dir=joyDir;
    if(!dir&&fieldMove) dir=fieldMove; fieldMove=null;
    if(dir){ player.dir=dir; const[dx,dy]=DIRV[dir],nx=player.x+dx,ny=player.y+dy, tn=tile(nx,ny);
      if(tn!=='1'&&tn!=='9'&&!npcAt(nx,ny)){ player.x=nx; player.y=ny; player.moving=true; } }
    if(consume('confirm')) tryInteractFacing();
    if(consume('cancel')){ state='menu'; menuMode='party'; menuSel=0; } }
  if(player.moving){ const tx=player.x*TILE,ty=player.y*TILE,sp=2.5;
    if(player.px<tx) player.px=Math.min(player.px+sp,tx); else if(player.px>tx) player.px=Math.max(player.px-sp,tx);

    const n=Math.max(1,alive.length), bw=Math.min(150,(W-16-(n-1)*6)/n);
    alive.forEach((o,k)=>{ const sel=o.idx===b.targetIdx; btn(8+k*(bw+6),by,bw,32,(sel?'▶ ':'')+o.e.name,()=>{ if(b.targetIdx===o.idx) confirmTarget(o.idx); else { b.targetIdx=o.idx; sfx('sel'); } },
      {bg:sel?'#3a2a2a':'rgba(14,18,28,.96)', fg:sel?'#f0c27a':'#aeb8d0', font:'12px sans-serif'}); }); }
  else if(b.menu==='targetAlly'||b.menu==='targetDead'){ g.fillStyle='#9fe8c4'; g.font='13px sans-serif'; g.textAlign='center'; g.fillText(b.menu==='targetDead'?'소생할 아군을 탭하세요':'아군을 탭하세요',W/2,by+20); g.textAlign='left'; } }

/* ================= 메시지 ================= */
/* 마지막 줄에서 예/아니오를 묻는 대화: 확인=yes(fn 실행), 취소=no(그냥 닫힘) */
function askMsg(l,yes,no,fn,fnNo){ showMsg(l); msg.ask={yes,no,fn,fnNo}; } // fnNo 가 없으면 '아니오'는 그냥 닫힌다
function updateMsg(){
  if(msg.ask&&msg.i>=msg.lines.length-1){ if(consume('confirm')){ const f=msg.ask.fn; msg=null; f(); } else if(consume('cancel')){ const f=msg.ask.fnNo; msg=null; sfx('sel'); if(f) f(); } return; }
  if(consume('confirm')||consume('cancel')){ msg.i++; if(msg.i>=msg.lines.length){ const a=msg.after; msg=null; if(a) a(); } } }
function drawMsgBox(){ const h=56; const raw=msg.lines[msg.i]; let nm=null, txt=raw, col='#9fe8c4';
  if(raw && typeof raw==='object'){ nm=raw.n; txt=raw.t; col=raw.c||'#9fe8c4'; }
  if(nm){ g.font='bold 12px sans-serif'; const nw=g.measureText(nm).width+16;
    g.fillStyle='rgba(8,10,20,.95)'; g.fillRect(14,H-h-23,nw,18); g.strokeStyle=col; g.lineWidth=1; g.strokeRect(14.5,H-h-22.5,nw-1,17);
    g.fillStyle=col; g.textAlign='left'; g.fillText(nm,22,H-h-10); }
  g.fillStyle='rgba(8,10,20,.95)'; g.fillRect(8,H-h-8,W-16,h); g.strokeStyle=nm?col:'#30406a'; g.strokeRect(8.5,H-h-7.5,W-17,h-1);
  g.fillStyle='#e8eef7'; g.font='12px sans-serif'; g.textAlign='left'; wrap(txt,18,H-h+6,W-36,15);
  if(msg.ask&&msg.i>=msg.lines.length-1){ btn(W-196,H-31,88,22,msg.ask.yes,()=>{ pressed.confirm=true; },{bg:'#4a2a2a',fg:'#ffb0a0',font:'12px sans-serif'}); btn(W-102,H-31,88,22,msg.ask.no,()=>{ pressed.cancel=true; },{font:'12px sans-serif'}); return; }
  g.fillStyle='#6b7590'; g.font='10px sans-serif'; g.textAlign='right'; g.fillText('탭/확인 ▶ ('+(msg.i+1)+'/'+msg.lines.length+')',W-16,H-12); g.textAlign='left';
  hz(0,0,W,H,()=>{ pressed.confirm=true; }); }
function wrap(text,x,y,maxw,lh){ let line='',yy=y+12; for(const ch of (text||'')){ if(g.measureText(line+ch).width>maxw){ g.fillText(line,x,yy); line=ch; yy+=lh; } else line+=ch; } g.fillText(line,x,yy); }

/* ================= 루프 ================= */
function update(){ { const now=Date.now(); if(state!=='title') playSec+=Math.min(1,Math.max(0,(now-lastTick)/1000)); lastTick=now; } // 플레이 시간 누적(탭이 멈춘 동안은 최대 1초만)
  if(msg) updateMsg();
  else if(state==='title') updateTitle(); else if(state==='field') updateField();
  else if(state==='menu') updateMenu(); else if(state==='shop') updateShop(); else if(state==='battle') updateBattle(); // 'jobpick' 은 화면의 버튼으로만 진행한다
  if(flash>0) flash--; if(shakeT>0) shakeT--; gtime++;
  if(pops.length){ for(const q of pops){ if(q.delay>0){ q.delay--; continue; } q.y-=0.5; q.t--; } pops=pops.filter(q=>q.t>0); }
  if(fx.length){ for(const f of fx){ if(f.delay>0) f.delay--; else f.t--; } fx=fx.filter(f=>f.t>0); }
  if(battle){ party.forEach(q=>{ if(q.hitFlash>0) q.hitFlash--; if(q.actAnim>0) q.actAnim--; }); battle.enemies.forEach(e=>{ if(e.actAnim>0) e.actAnim--; if(e.dying>0) e.dying--; }); }
  clearPressed(); }
function draw(){ g.setTransform(1,0,0,1,0,0); // 매 프레임 변환 초기화(흔들림 등 누적 방지)
  hotspots=[]; g.textAlign='left'; g.textBaseline='alphabetic'; g.font='12px sans-serif';
  if(state==='title') drawTitle(); else if(state==='field') drawField(); else if(state==='menu') drawMenu();
  else if(state==='shop') drawShop(); else if(state==='battle') drawBattle(); else if(state==='jobpick') drawJobPick();
  if(state==='battle'){ drawFx(); drawArtFx(); drawPops(); }
  if(msg) drawMsgBox();
  if(state!=='title') drawFeatToast(); }
/* 전투 2배속: 전투 중에만 한 화면에 두 번 진행한다. 설정은 기기에 기억 */
let fastBattle=false; try{ fastBattle=localStorage.getItem('pixel-adventure-fast')==='1'; }catch(e){}
function toggleFast(){ fastBattle=!fastBattle; sfx('sel'); try{ localStorage.setItem('pixel-adventure-fast',fastBattle?'1':'0'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.hidden) autoSave(); }); // 앱을 내리거나 닫을 때 저장
function loop(){ update(); if(fastBattle&&state==='battle') update(); draw(); requestAnimationFrame(loop); }
loop();
</script>

if('serviceWorker' in navigator && location.protocol==='https:'){ window.addEventListener('load', function(){ navigator.serviceWorker.register('service-worker.js').catch(function(){}); }); }
